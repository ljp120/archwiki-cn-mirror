<div class="mw-body-content" id="mw-content-text"><h1 data-bm="pgef1ae058a163">GNU/文档</h1><div class="mw-content-ltr mw-parser-output" dir="ltr" lang="zh-Hans-CN">
<div class="mw-heading mw-heading2"><h2 data-bm="pgef1ae058a163_Texinfo" id="Texinfo">Texinfo</h2></div>
<p>GNU 软件以 <a href="https://www.gnu.org/software/texinfo/">Texinfo</a> 排版规则来编排文档。您可以使用 <code>info</code> 程序查阅 info 文档，它来自 <span class="nobreak"><span class="plainlinks archwiki-template-pkg"><a href="https://archlinux.org/packages/?name=texinfo">texinfo</a></span><sup><small>包</small></sup></span> 软件包。
</p><p>大部分 GNU 软件都提供了 <a href="#pg49a53c288b70">man 手册</a>， 但 info 文档内容往往更加全面（但普遍缺少中文译文）。若要浏览 info 文档，只需输入：
</p>
<pre>$ info <i>页面名称</i>
</pre>
